# The comparison site used to live at the root of this host; its two pages keep working.
server {
	listen 8080;
	server_name agent-stacks.hyperlab.sh;
	return 301 https://frankstack.hyperlab.sh/learn$request_uri;
}

server {
	listen 8080 default_server;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	# A directory asked for without its slash gets a 301 to the slash form.
	absolute_redirect off;

	gzip on;
	gzip_types text/html text/css application/javascript application/json image/svg+xml;

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	# Nothing lives at the root yet: the site starts at the comparison.
	location = / {
		return 302 /learn/;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
